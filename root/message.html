<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿烽留言板</title>
    <link rel="icon" href="https://pic2.ziyuan.wang/user/Ayang/2026/03/icon_f312f1cc70b04.ico">
    <link rel="stylesheet" href="./css/home.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            min-height: 100vh;
        }
        body {
            background: linear-gradient(135deg, #dbeafe 0%, #fef9c3 50%, #fce7f3 100%);
            background-attachment: fixed;
            font-family: "楷体", "KaiTi", "Microsoft YaHei", sans-serif;
            padding: 40px 15px;
            color: #475569;
            position: relative;
        }
        /* 底部水墨山装饰 */
        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 180px;
            background: linear-gradient(to top, rgba(147, 197, 253, 0.2), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 顶部导航 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .top-bar h1 {
            font-size: 26px;
            font-weight: normal;
            color: #334155;
        }
        .top-bar a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .top-bar a:hover {
            color: #3b82f6;
        }
        .back {
            display: inline-block;
            margin-bottom: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }
        .back:hover {
            color: #3b82f6;
        }

        /* 毛玻璃卡片 */
        .card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 22px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
        .card-title {
            font-size: 17px;
            color: #475569;
            margin-bottom: 22px;
            font-weight: normal;
        }

        /* 发表表单 */
        .input-line {
            margin-bottom: 18px;
        }
        .input-line input,
        .input-line textarea {
            width: 100%;
            border: none;
            border-bottom: 1px solid #cbd5e1;
            background: transparent;
            padding: 10px 4px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            color: #334155;
            transition: border-color 0.3s;
        }
        .input-line input:focus,
        .input-line textarea:focus {
            border-bottom-color: #3b82f6;
        }
        .input-line textarea {
            resize: vertical;
            min-height: 75px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: #fff;
            border: none;
            padding: 9px 32px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 留言列表标题 */
        .list-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 18px;
        }
        .list-head .title {
            font-size: 17px;
            font-weight: normal;
        }
        .list-head .count {
            font-size: 12px;
            color: #94a3b8;
        }

        /* 单条留言 */
        .msg {
            display: flex;
            padding: 18px 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        .msg:last-child {
            border-bottom: none;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            flex-shrink: 0;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        .msg-body {
            flex: 1;
            min-width: 0;
        }
        .msg-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .nickname {
            font-size: 15px;
            color: #334155;
            font-weight: bold;
        }
        .time {
            font-size: 12px;
            color: #94a3b8;
        }
        .top-badge {
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 4px;
            background: #fef2f2;
            color: #ef4444;
        }
        .msg-content {
            font-size: 14.5px;
            line-height: 1.75;
            color: #475569;
            word-break: break-word;
        }
        .msg-footer {
            margin-top: 8px;
            text-align: right;
        }
        .like-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            padding: 3px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .like-btn:hover {
            color: #f43f5e;
            background: #fff1f2;
        }

        /* 分页 */
        .page-box {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 22px;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 5px 13px;
            border: 1px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #64748b;
            font-family: inherit;
            transition: all 0.2s;
        }
        .page-btn:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .page-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="../index.html" class="back">← 返回首页</a>

        <div class="top-bar">
            <h1>阿烽留言板</h1>
            <a href="./admin.html">管理面板</a>
        </div>

        <!-- 发表留言 -->
        <div class="card">
            <div class="card-title">发表留言</div>
            <div class="input-line">
                <input type="text" id="username" placeholder="你的昵称">
            </div>
            <div class="input-line">
                <textarea id="content" placeholder="写下想说的话..."></textarea>
            </div>
            <button id="submitBtn" class="btn-primary">发布留言</button>
        </div>

        <!-- 留言列表 -->
        <div class="card">
            <div class="list-head">
                <span class="title">留言列表</span>
                <span class="count" id="msgCount">共 0 条</span>
            </div>
            <div id="msgList">
                <div class="loading">加载中...</div>
            </div>
            <div class="page-box" id="pagination"></div>
        </div>
    </div>

<script>
const SUPABASE_URL = "https://vdmuxkapemtopjmwnpvb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GUySM7Ho51-9XwDPn_UJjw_Bgl0nxJ0";
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const username = document.getElementById('username');
const content = document.getElementById('content');
const submitBtn = document.getElementById('submitBtn');
const msgList = document.getElementById('msgList');
const msgCount = document.getElementById('msgCount');
const pagination = document.getElementById('pagination');

const PAGE_SIZE = 10;
let currentPage = 1;
let totalCount = 0;

// 昵称首字做头像
function firstChar(name) {
    return name ? name.trim().charAt(0).toUpperCase() : '匿';
}

// 格式化时间
function fmtTime(t) {
    return new Date(t).toLocaleString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
    });
}

// 渲染分页留言
async function renderMsg(page = 1) {
    msgList.innerHTML = '<div class="loading">加载中...</div>';
    currentPage = page;
    const start = (page - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE - 1;

    // 总数
    const { count } = await sb
        .from('messages')
        .select('*', { count: 'exact', head: true });
    totalCount = count || 0;
    msgCount.innerText = `共 ${totalCount} 条`;

    // 当前页数据
    const { data, error } = await sb
        .from('messages')
        .select('*')
        .order('is_top', { ascending: false })
        .order('created_at', { ascending: false })
        .range(start, end);

    if (error) {
        msgList.innerHTML = `<div class="loading" style="color:#ef4444;">加载失败：${error.message}</div>`;
        return;
    }
    if (data.length === 0) {
        msgList.innerHTML = '<div class="loading">暂无留言，来发第一条吧～</div>';
        pagination.innerHTML = '';
        return;
    }

    msgList.innerHTML = '';
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `
            <div class="avatar">${firstChar(item.nickname)}</div>
            <div class="msg-body">
                <div class="msg-meta">
                    <span class="nickname">${item.nickname}</span>
                    ${item.is_top ? '<span class="top-badge">置顶</span>' : ''}
                    <span class="time">${fmtTime(item.created_at)}</span>
                </div>
                <div class="msg-content">${item.content}</div>
                <div class="msg-footer">
                    <button class="like-btn" data-id="${item.id}" data-like="${item.like_count || 0}">
                        ❤️ ${item.like_count || 0}
                    </button>
                </div>
            </div>
        `;
        msgList.appendChild(div);
    })

    // 绑定点赞
    document.querySelectorAll('.like-btn').forEach(btn => {
        btn.onclick = async function () {
            const id = this.dataset.id;
            const num = Number(this.dataset.like) || 0;
            const { error } = await sb
                .from('messages')
                .update({ like_count: num + 1 })
                .eq('id', id);
            if (!error) renderMsg(currentPage);
        }
    })

    renderPagination();
}

// 分页按钮
function renderPagination() {
    const totalPages = Math.ceil(totalCount / PAGE_SIZE);
    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    pagination.innerHTML = '';

    const prev = document.createElement('button');
    prev.className = 'page-btn';
    prev.innerText = '上一页';
    prev.disabled = currentPage === 1;
    prev.onclick = () => renderMsg(currentPage - 1);
    pagination.appendChild(prev);

    for (let i = 1; i <= totalPages; i++) {
        const b = document.createElement('button');
        b.className = 'page-btn' + (i === currentPage ? ' active' : '');
        b.innerText = i;
        b.onclick = () => renderMsg(i);
        pagination.appendChild(b);
    }

    const next = document.createElement('button');
    next.className = 'page-btn';
    next.innerText = '下一页';
    next.disabled = currentPage === totalPages;
    next.onclick = () => renderMsg(currentPage + 1);
    pagination.appendChild(next);
}

// 提交留言
submitBtn.onclick = async function(){
    submitBtn.disabled = true;
    submitBtn.innerText = "发布中...";

    const nameVal = username.value.trim();
    const textVal = content.value.trim();

    if(!nameVal){ alert('请填写昵称！'); resetBtn(); return; }
    if(!textVal){ alert('请填写留言内容！'); resetBtn(); return; }

    const { error } = await sb
        .from('messages')
        .insert([{ nickname: nameVal, content: textVal }]);

    if(error){ alert("提交失败："+error.message); resetBtn(); return; }
    alert('发布成功！');
    username.value = '';
    content.value = '';
    renderMsg(1);
    resetBtn();

    function resetBtn() {
        submitBtn.disabled = false;
        submitBtn.innerText = "发布留言";
    }
}

renderMsg(1);
</script>
</body>
</html>
