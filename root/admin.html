<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言管理面板</title>
    <link rel="icon" href="https://pic2.ziyuan.wang/user/Ayang/2026/03/icon_f312f1cc70b04.ico">
    <link rel="stylesheet" href="./css/home.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe 0%, #fef9c3 50%, #fce7f3 100%);
            background-attachment: fixed;
            font-family: "楷体", "KaiTi", "Microsoft YaHei", sans-serif;
            padding: 40px 15px;
            color: #475569;
        }

        .wrap {
            max-width: 780px;
            margin: 0 auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #3b82f6;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            color: #334155;
            margin-bottom: 22px;
        }

        .card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 22px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        .card-title {
            font-size: 17px;
            margin-bottom: 20px;
            font-weight: normal;
        }

        /* 登录 */
        .pwd-input {
            width: 260px;
            border: none;
            border-bottom: 1px solid #cbd5e1;
            background: transparent;
            padding: 10px 4px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            margin-right: 14px;
        }

        .pwd-input:focus {
            border-bottom-color: #3b82f6;
        }

        .btn-primary {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: #fff;
            border: none;
            padding: 9px 26px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }

        /* 控制面板 */
        .ctrl-bar {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            padding-bottom: 18px;
            margin-bottom: 10px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .ctrl-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #64748b;
        }

        .ctrl-item select,
        .ctrl-item input {
            padding: 5px 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .ctrl-item button {
            padding: 5px 14px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }

        /* 留言项 */
        .msg {
            display: flex;
            padding: 15px 0;
            border-bottom: 1px dashed #e2e8f0;
        }

        .msg:last-child {
            border-bottom: none;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            flex-shrink: 0;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }

        .msg-body {
            flex: 1;
            min-width: 0;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }

        .nickname {
            font-size: 14px;
            color: #334155;
            font-weight: bold;
        }

        .time {
            font-size: 12px;
            color: #94a3b8;
        }

        .like-num {
            font-size: 12px;
            color: #94a3b8;
        }

        .top-badge {
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 4px;
            background: #fef2f2;
            color: #ef4444;
        }

        .msg-content {
            font-size: 14px;
            line-height: 1.7;
            color: #475569;
            word-break: break-word;
        }

        .msg-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        .opt-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .top-btn {
            background: #fef3c7;
            color: #d97706;
        }

        .del-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        /* 分页 */
        .page-box {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 5px 12px;
            border: 1px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: #64748b;
            font-family: inherit;
        }

        .page-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 25px 0;
            font-size: 14px;
        }

        /* Markdown 渲染排版 */
        .markdown-body p { margin: 0 0 8px; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
            margin: 10px 0 8px; font-size: 15px; font-weight: bold; color: #334155;
        }
        .markdown-body ul, .markdown-body ol { margin: 6px 0; padding-left: 22px; }
        .markdown-body blockquote {
            margin: 8px 0; padding: 6px 12px; border-left: 3px solid #93c5fd;
            background: rgba(219, 234, 254, 0.35); color: #64748b; border-radius: 0 6px 6px 0;
        }
        .markdown-body code {
            background: rgba(148, 163, 184, 0.18); padding: 1px 6px; border-radius: 4px;
            font-family: Consolas, Monaco, monospace; font-size: 13px; color: #db2777;
        }
        .markdown-body pre {
            background: #1e293b; color: #e2e8f0; padding: 12px 14px; border-radius: 8px;
            overflow-x: auto; margin: 8px 0;
        }
        .markdown-body pre code { background: transparent; color: inherit; padding: 0; }
        .markdown-body a { color: #3b82f6; text-decoration: underline; }
        .markdown-body img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
        .markdown-body hr { border: none; border-top: 1px dashed #cbd5e1; margin: 10px 0; }
        .markdown-body table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
        .markdown-body th, .markdown-body td { border: 1px solid #cbd5e1; padding: 5px 10px; }
        .markdown-body th { background: rgba(148, 163, 184, 0.15); }

        /* 楼中楼 */
        .reply-count-badge {
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 4px;
            background: #eff6ff;
            color: #3b82f6;
            cursor: pointer;
        }
        .replies {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 10px;
            padding: 4px 14px;
        }
        .reply-item {
            display: flex;
            padding: 9px 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        .reply-item:last-child { border-bottom: none; }
        .reply-avatar {
            width: 26px; height: 26px; border-radius: 50%;
            background: linear-gradient(135deg, #fbbf24, #f97316);
            flex-shrink: 0; margin-right: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 11px; font-weight: bold;
        }
        .reply-body { flex: 1; min-width: 0; }
        .reply-meta {
            display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap;
        }
        .reply-nick { font-size: 13px; color: #334155; font-weight: bold; }
        .reply-to { font-size: 12px; color: #64748b; }
        .reply-time { font-size: 11px; color: #94a3b8; }
        .reply-content {
            font-size: 13px; line-height: 1.7; color: #475569; word-break: break-word;
        }
        .reply-del {
            background: #fee2e2; color: #dc2626; border: none; border-radius: 4px;
            font-size: 11px; padding: 2px 8px; cursor: pointer; font-family: inherit;
            margin-left: 6px;
        }
        .empty-replies { font-size: 12px; color: #94a3b8; padding: 8px 0; }
    </style>
</head>

<body>
    <div class="wrap">
        <a href="./message.html" class="back">← 返回留言板</a>
        <h1>留言管理面板</h1>

        <!-- 登录 -->
        <div class="card" id="loginBox">
            <div class="card-title">管理员身份验证</div>
            <input type="password" id="adminPwd" class="pwd-input" placeholder="输入管理员密码">
            <button id="loginBtn" class="btn-primary">登录</button>
        </div>

        <!-- 管理面板 -->
        <div id="adminPanel" style="display:none;">
            <div class="card">
                <div class="ctrl-bar">
                    <div class="ctrl-item">
                        <span>每页</span>
                        <input type="number" id="pageSize" value="10" min="1" style="width:55px;">
                        <span>条</span>
                        <button id="changePageSize">确认</button>
                    </div>
                    <div class="ctrl-item">
                        <span>排序</span>
                        <select id="sortType">
                            <option value="top_time">置顶优先+最新</option>
                            <option value="time">仅时间最新</option>
                            <option value="like">点赞最多</option>
                        </select>
                        <button id="changeSort">切换</button>
                    </div>
                </div>

                <div id="adminMsgList">
                    <div class="loading">加载中...</div>
                </div>
                <div class="page-box" id="pagination"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vdmuxkapemtopjmwnpvb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_GUySM7Ho51-9XwDPn_UJjw_Bgl0nxJ0";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginBox = document.getElementById('loginBox');
        const adminPanel = document.getElementById('adminPanel');
        const adminPwd = document.getElementById('adminPwd');
        const loginBtn = document.getElementById('loginBtn');
        const adminMsgList = document.getElementById('adminMsgList');
        const pageSizeInput = document.getElementById('pageSize');
        const changePageSize = document.getElementById('changePageSize');
        const sortType = document.getElementById('sortType');
        const changeSort = document.getElementById('changeSort');
        const pagination = document.getElementById('pagination');

        let pageSize = 10;
        let currentPage = 1;
        let totalCount = 0;
        let sortRule = "top_time";

        function firstChar(name) {
            return name ? name.trim().charAt(0).toUpperCase() : '匿';
        }
        function fmtTime(t) {
            return new Date(t).toLocaleString('zh-CN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // Markdown 渲染：marked 解析 + DOMPurify 过滤，防止 XSS
        if (typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true });
        function renderMd(text) {
            try {
                return DOMPurify.sanitize(marked.parse(String(text ?? '')));
            } catch (err) {
                return esc(text).replace(/\n/g, '<br>');
            }
        }
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }


        // ===== bcrypt加密密码校验 =====
        loginBtn.onclick = async function () {
            const pwd = adminPwd.value.trim();
            if (!pwd) { alert('请输入密码'); return; }
            // 前端拦哈希串
            if (pwd.includes('$')) {
                alert('非法输入');
                return;
            }

            // 调用数据库接口，返回true/false
            const { data } = await sb.rpc('check_admin_pwd', { input_pwd: pwd });

            if (data === true) {
                loginBox.style.display = 'none';
                adminPanel.style.display = 'block';
                renderAdminMsg(1);
            } else {
                alert("密码错误");
            }
        }



        // 渲染管理列表
        async function renderAdminMsg(page = 1) {
            adminMsgList.innerHTML = '<div class="loading">加载中...</div>';
            currentPage = page;
            const start = (page - 1) * pageSize;
            const end = start + pageSize - 1;

            const { count } = await sb
                .from('messages')
                .select('*', { count: 'exact', head: true });
            totalCount = count || 0;

            let query = sb.from('messages').select('*');
            if (sortRule === "top_time") {
                query = query.order('is_top', { ascending: false }).order('created_at', { ascending: false });
            } else if (sortRule === "time") {
                query = query.order('created_at', { ascending: false });
            } else if (sortRule === "like") {
                query = query.order('like_count', { ascending: false });
            }

            const { data, error } = await query.range(start, end);

            if (error) {
                adminMsgList.innerHTML = `<div class="loading" style="color:#ef4444;">加载失败</div>`;
                return;
            }
            if (data.length === 0) {
                adminMsgList.innerHTML = '<div class="loading">暂无留言</div>';
                return;
            }

            adminMsgList.innerHTML = "";
            const msgIds = data.map(i => i.id);
            let replyCountMap = {};
            if (msgIds.length) {
                const { data: rc } = await sb
                    .from('replies')
                    .select('message_id')
                    .in('message_id', msgIds);
                (rc || []).forEach(r => {
                    replyCountMap[r.message_id] = (replyCountMap[r.message_id] || 0) + 1;
                });
            }

            data.forEach(item => {
                const rc = replyCountMap[item.id] || 0;
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `
            <div class="avatar">${esc(firstChar(item.nickname))}</div>
            <div class="msg-body">
                <div class="msg-meta">
                    <span class="nickname">${esc(item.nickname)}</span>
                    <span class="time">ID: ${esc(item.id)}</span>
                    ${item.is_top ? '<span class="top-badge">置顶</span>' : ''}
                    <span class="time">${fmtTime(item.created_at)}</span>
                    <span class="like-num">❤️ ${item.like_count || 0}</span>
                    <span class="reply-count-badge" data-id="${item.id}" data-loaded="0">💬 回复 ${rc}</span>
                </div>
                <div class="msg-content markdown-body">${renderMd(item.content)}</div>
                <div class="replies" id="admreplies-${item.id}" style="display:none;"></div>
                <div class="msg-actions">
                    <button class="opt-btn top-btn" data-id="${item.id}" data-top="${item.is_top}">
                        ${item.is_top ? '取消置顶' : '设为置顶'}
                    </button>
                    <button class="opt-btn del-btn" data-id="${item.id}" data-nick="${esc(item.nickname)}" data-replies="${rc}">删除</button>
                </div>
            </div>
        `;
                adminMsgList.appendChild(div);
            })

            // 绑定事件
            document.querySelectorAll('.top-btn').forEach(btn => {
                btn.onclick = async function () {
                    const id = this.dataset.id;
                    const nowTop = this.dataset.top === "true";
                    await sb.from('messages').update({ is_top: !nowTop }).eq('id', id);
                    renderAdminMsg(currentPage);
                }
            })
            document.querySelectorAll('.reply-count-badge').forEach(btn => {
                btn.onclick = async function () {
                    const id = this.dataset.id;
                    const box = document.getElementById('admreplies-' + id);
                    if (box.style.display === 'none') {
                        box.style.display = 'block';
                        if (this.dataset.loaded !== "1") {
                            this.dataset.loaded = "1";
                            await loadAdminReplies(id);
                        }
                    } else {
                        box.style.display = 'none';
                    }
                }
            })
            document.querySelectorAll('.del-btn').forEach(btn => {
                btn.onclick = async function () {
                    const id = this.dataset.id;
                    const rc = Number(this.dataset.replies) || 0;
                    const warn = rc > 0
                        ? `这条留言下有 ${rc} 条楼中楼回复，将一并永久删除，确定？`
                        : "确定永久删除这条留言？";
                    if (!confirm(warn)) return;
                    await sb.from('replies').delete().eq('message_id', id);
                    await sb.from('messages').delete().eq('id', id);
                    renderAdminMsg(currentPage);
                }
            })

            renderPagination();
        }

        // 加载某条留言下的楼中楼回复（管理端）
        async function loadAdminReplies(msgId) {
            const box = document.getElementById('admreplies-' + msgId);
            box.innerHTML = '<div class="empty-replies">加载中...</div>';
            const { data } = await sb
                .from('replies')
                .select('*')
                .eq('message_id', msgId)
                .order('created_at', { ascending: true });

            if (!data || data.length === 0) {
                box.innerHTML = '<div class="empty-replies">暂无回复</div>';
                return;
            }
            const byId = {};
            data.forEach(r => { byId[r.id] = r; });

            box.innerHTML = '';
            data.forEach(r => {
                const parent = r.parent_id ? byId[r.parent_id] : null;
                const item = document.createElement('div');
                item.className = 'reply-item';
                item.innerHTML = `
                    <div class="reply-avatar">${esc(firstChar(r.nickname))}</div>
                    <div class="reply-body">
                        <div class="reply-meta">
                            <span class="reply-nick">${esc(r.nickname)}</span>
                            ${parent ? `<span class="reply-to">回复 @${esc(parent.nickname)}</span>` : ''}
                            <span class="reply-time">${fmtTime(r.created_at)}</span>
                            <button class="reply-del" data-id="${r.id}">删除</button>
                        </div>
                        <div class="reply-content markdown-body">${renderMd(r.content)}</div>
                    </div>
                `;
                box.appendChild(item);
            });
            box.querySelectorAll('.reply-del').forEach(btn => {
                btn.onclick = async function () {
                    if (!confirm("确定删除这条回复？")) return;
                    await sb.from('replies').delete().eq('id', this.dataset.id);
                    await loadAdminReplies(msgId);
                }
            })
        }

        function renderPagination() {
            const totalPages = Math.ceil(totalCount / pageSize);
            if (totalPages <= 1) { pagination.innerHTML = ''; return; }
            pagination.innerHTML = '';

            const prev = document.createElement('button');
            prev.className = 'page-btn';
            prev.innerText = '上一页';
            prev.disabled = currentPage === 1;
            prev.onclick = () => renderAdminMsg(currentPage - 1);
            pagination.appendChild(prev);

            for (let i = 1; i <= totalPages; i++) {
                const b = document.createElement('button');
                b.className = 'page-btn' + (i === currentPage ? ' active' : '');
                b.innerText = i;
                b.onclick = () => renderAdminMsg(i);
                pagination.appendChild(b);
            }

            const next = document.createElement('button');
            next.className = 'page-btn';
            next.innerText = '下一页';
            next.disabled = currentPage === totalPages;
            next.onclick = () => renderAdminMsg(currentPage + 1);
            pagination.appendChild(next);
        }

        changePageSize.onclick = function () {
            pageSize = Math.max(1, Number(pageSizeInput.value));
            renderAdminMsg(1);
        }
        changeSort.onclick = function () {
            sortRule = sortType.value;
            renderAdminMsg(1);
        }
    </script>
</body>

</html>
