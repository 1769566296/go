<!DOCTYPE html>
<!-- ==========================================================================
     404 错误页  404.html
     ----------------------------------------------------------------------
     当访客访问了不存在的地址时，托管平台（如 GitHub Pages）会自动显示这一页。
     它复用了全站的页头、导航、页脚，所以风格和整站一致。
     结构说明请看 basics.html。
     ========================================================================== -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面走丢了 · 菜鸟醒狮</title>
    <link rel="stylesheet" href="./go/root/css/style.css">
</head>

<body>

   

    <!-- .error-page 用 flex 把整块内容在屏幕中央居中 -->
    <main class="error-page">
        <div class="container">
            <div class="error-code">404</div>
            <h1 class="error-title">这头狮子走丢了</h1>
            <p class="error-desc">你要找的页面不存在，或者已经被移走了。<br>不如回去，接着走那条醒狮路。</p>

            <div class="hero-actions">
                <a href="index.html" class="btn btn-primary">返回首页</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span id="year">2026</span> 菜鸟醒狮 · 传承中华醒狮文化</p>
        </div>
    </footer>

    <script src="js/main.js"></script>

</body>
</html>
